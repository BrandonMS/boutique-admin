services:
  postgres:
    image: postgres:16-alpine
    container_name: boutique-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boutique-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../boutique-backend
      dockerfile: Dockerfile
    container_name: boutique-backend
    env_file:
      - ../boutique-backend/.env
    environment:
      NODE_ENV: development
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_change_in_production_12345
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../boutique-backend:/app
      - /app/node_modules
    command: npm run dev

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boutique-admin
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
    ports:
      - "3001:3001"
    depends_on:
      - backend

  web:
    build:
      context: ../boutique-web
      dockerfile: Dockerfile
    container_name: boutique-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
